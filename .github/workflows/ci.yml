name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck            # packages and test files
      - run: pnpm test                 # fails below 100% line/branch/function coverage
      - run: pnpm verify:pack          # the tarballs npm would get, installed and run by package name
      - run: pnpm smoke                # the built package, README example, on Node
      - run: pnpm lint:redos

  runtimes:
    # D1: the same built package gives byte-identical results on Bun and Deno.
    # The smoke script runs ON the runtime itself — `bun x vitest` would run Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun scripts/smoke.mjs
      - run: deno run --allow-read scripts/smoke.mjs

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on copyleft or unknown licenses anywhere in the tree (D21).
      - run: >
          pnpm dlx license-checker-rseidelsohn
          --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0"
          --excludePrivatePackages
